[package]
name = "nsm-cli"
version = "0.1.0"
edition = "2021"

# Deliberately tiny. Everything here is measured into PCR0, so every crate
# added is something a reader verifying an attestation has to accept — see the
# note at the top of enclave/Dockerfile.
[dependencies]
aws-nitro-enclaves-nsm-api = "0.4"
serde_bytes = "0.11"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
strip = true
